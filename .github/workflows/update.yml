name: update feeds
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: feeds
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch feeds from GAS and split
        run: python3 build.py
      - name: commit if changed
        run: |
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" || (git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
